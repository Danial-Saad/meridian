org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false

# Longer network timeouts for Maven dependency resolution. Default Gradle
# timeouts can be too short on slow/flaky connections, which makes a
# dependency that genuinely exists (e.g. androidx.media:media) come back
# as "Could not find" simply because the request didn't finish in time.
# This does not help if a firewall/VPN/proxy is blocking the repository
# hosts outright -- that needs fixing at the network level, not here.
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=120000