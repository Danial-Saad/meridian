plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace "com.meridian.app"
    // These three delegate to the Flutter SDK you build with, rather than
    // hardcoding numbers here that could drift out of date with whatever
    // Flutter version ends up building this project.
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // FEATURE 6 fallout: flutter_local_notifications' Android AAR
        // declares a dependency on java.time/java.util APIs that only
        // exist natively on API 26+. Without desugaring enabled, Gradle
        // refuses to even start the build — it fails immediately at
        // :app:checkDebugAarMetadata (or checkReleaseAarMetadata) with
        // "Dependency ':flutter_local_notifications' requires core
        // library desugaring to be enabled for :app." This was missing
        // even though the plugin/permission were already wired in.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // Bundle / Play Store identifier. Change this before publishing —
        // "com.meridian.app" is a placeholder, not a real registered id.
        applicationId "com.meridian.app"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // Signed with the debug key for now so `flutter run --release`
            // and `flutter build apk` work out of the box. Swap in a real
            // signing config (see README) before distributing this build.
            signingConfig signingConfigs.debug
            // R8 code shrinking/obfuscation + unused-resource stripping.
            // These were off, which means every release build shipped
            // unminified, un-tree-shaken Dart/Kotlin glue and every
            // drawable/resource regardless of use — bigger download, more
            // to load off disk at cold start. proguard-rules.pro keeps the
            // few classes the bundled plugins touch via reflection.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // Required by coreLibraryDesugaringEnabled above.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
